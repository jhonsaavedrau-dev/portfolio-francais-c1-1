<!doctype html><html lang="es"><head><meta charset="utf-8"><title>PLEX PLAY se mudó</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://jhonsaavedrau-dev.github.io/plexplay/app/">
<script>
/* PLEX PLAY ahora vive en https://jhonsaavedrau-dev.github.io/plexplay/app/ (mismo dominio: el progreso y la sesión se conservan).
   Se conserva la búsqueda y el fragmento para que el regreso del inicio de sesión con Google (#access_token / ?code=) llegue a la app. */
(function(){
  var NUEVA = "https://jhonsaavedrau-dev.github.io/plexplay/app/";
  var archivo = location.pathname.split("/plexplay/")[1] || "";
  if (!/^(privacy|terminos|carnet|creditos-fotos)\.html$/.test(archivo)) archivo = "";
  try { navigator.serviceWorker && navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ if (r.scope.indexOf("/portfolio-francais-c1-1/") > -1) r.unregister(); }); }); } catch (e) {}
  location.replace(NUEVA + archivo + location.search + location.hash);
})();
</script></head>

</body></html>
